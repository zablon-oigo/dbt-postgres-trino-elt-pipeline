version: 2

models:
  - name: stg_customers
    description: "Cleaned customers"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null

  - name: stg_employees
    description: "Cleaned employees"
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: office_id
        tests:
          - not_null

  - name: stg_offices
    description: "Cleaned offices"
    columns:
      - name: office_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Cleaned orders"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['Shipped', 'Resolved', 'Cancelled', 'On Hold', 'Disputed', 'In Process']

  - name: stg_orderdetails
    description: "Cleaned order line items"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity_ordered
        tests:
          - not_null
      - name: price_each
        tests:
          - not_null

  - name: stg_payments
    description: "Cleaned payments"
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: check_number
        tests:
          - not_null
      - name: amount
        tests:
          - not_null

  - name: stg_productlines
    description: "Cleaned product lines"
    columns:
      - name: product_line
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Cleaned products"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_line
        tests:
          - not_null


  - name: int_order_details
    description: "Order lines enriched with product & order info"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: line_revenue
        tests:
          - not_null


  - name: dim_customers
    description: "Customer dimension"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_employees
    description: "Employee dimension"
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null

  - name: dim_offices
    description: "Office dimension"
    columns:
      - name: office_id
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product dimension"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null


  - name: fct_orders
    description: "Order fact (one row per order)"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_payments
    description: "Payment fact"
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: amount
        tests:
          - not_null

  - name: fact_sales
    description: "Sales fact at order-line grain"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: revenue
        tests:
          - not_null